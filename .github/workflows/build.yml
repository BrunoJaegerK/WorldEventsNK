name: Build WorldEventsNK
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worldeventsnk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WorldEventsNK
        uses: actions/checkout@v4
      - name: Checkout PM1E release
        uses: actions/checkout@v4
        with:
          repository: BrunoJaegerK/NukkitPetteriM1Edition
          ref: release
          path: pm1e
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install PM1E API
        run: mvn --batch-mode --no-transfer-progress -f pm1e/pom.xml -DskipTests install
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldEventsNK
          path: target/WorldEventsNK.jar
          if-no-files-found: error
          retention-days: 14
