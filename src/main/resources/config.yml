settings:
  language: es_ES
  debug: false

events:
  enabled: true
  automatic: true
  minimum-online-players: 3
  minimum-interval-seconds: 1800
  maximum-interval-seconds: 3600
  duration-seconds: 600

worlds:
  excluded: ""
  minimum-distance-from-spawn: 100
  maximum-distance-from-spawn: 3000
  location-attempts-per-world: 20

meteorfall:
  radius: 4
  depth: 2

losttreasure:
  claim-radius: 5
  hint-interval-seconds: 120
  maximum-hints: 3

economy:
  enabled: true
  provider: EconomyAPI

protection:
  enabled: true
  fail-safe: true

performance:
  max-block-changes-per-event: 150
