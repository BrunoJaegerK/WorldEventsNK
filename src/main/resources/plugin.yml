name: WorldEventsNK
main: com.brunojaeger.worldevents.WorldEventsNK
version: "1.0.0"
api: ["1.0.0"]
load: POSTWORLD
author: BrunoJaegerK
description: Eventos dinámicos permanentes y temporales para Survival en Nukkit PM1E
softdepend:
  - EconomyAPI
commands:
  we:
    description: Administración y consulta de WorldEventsNK
    usage: "/we [list|status|history|start|stop|claim|stats|reload]"
    aliases: [worldevents]
permissions:
  worldevents.admin:
    description: Acceso completo a la administración de WorldEventsNK
    default: op
  worldevents.start:
    description: Permite iniciar eventos manualmente
    default: op
  worldevents.stop:
    description: Permite detener eventos
    default: op
  worldevents.stats:
    description: Permite consultar estadisticas de eventos
    default: true
