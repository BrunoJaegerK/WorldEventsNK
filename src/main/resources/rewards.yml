# Desactiva todas las recompensas con enabled: false.
enabled: true

losttreasure:
  money-min: 150
  money-max: 400
  diamond-min: 2
  diamond-max: 6
  emerald-min: 3
  emerald-max: 8

  # Premio adicional opcional. Usa el ID numérico del objeto Bedrock/Nukkit.
  # Con id: 0 o chance: 0 queda desactivado.
  bonus-item-id: 0
  bonus-item-damage: 0
  bonus-item-chance-percent: 0
  bonus-item-min: 1
  bonus-item-max: 1

meteorfall:
  # La recompensa del núcleo es independiente de LostTreasure.
  # Dinero opcional; EconomyAPI debe estar instalado para entregarlo.
  money-min: 0
  money-max: 0
  diamond-min: 1
  diamond-max: 2
  emerald-min: 0
  emerald-max: 1
  bonus-item-id: 0
  bonus-item-damage: 0
  bonus-item-chance-percent: 0
  bonus-item-min: 1
  bonus-item-max: 1
